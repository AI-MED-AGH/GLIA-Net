[project]
name = "glia-net"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dominik", email = "zawlockidominik@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "colorlog>=6.12.0",
    "matplotlib>=3.9.4",
    "medpy>=0.5.2",
    "nibabel>=5.3.3",
    "pillow>=11.3.0",
    "pyyaml>=6.0.3",
    "scikit-image>=0.24.0",
    "scikit-learn>=1.6.1",
    "simpleitk>=2.0.0rc1",
    "tensorboardx>=2.6.5",
]

[project.scripts]
glia-net = "glia_net:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
